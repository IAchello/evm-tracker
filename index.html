<style>
:root{
  --navy:#002244; --dk2:#003F7B; --blue:#0054A5; --cyan:#00ABD6; --lb:#75BBFF; --grey:#9A9B9C; --lt:#F2F2F2; --lt2:#D8D8D8;
  --orange:#F26B43; --olive:#7D8A00; --bad:#C0392B; --ok:#2F7D32; --warn:#B26A00;
  --ink:#1c2733; --muted:#5b6672; --line:#d8dde3; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;background:var(--lt);color:var(--ink);font-size:15px;line-height:1.35}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:4px;display:flex}
.logo img{height:42px;width:auto;display:block}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 small{display:block;font-size:12px;font-weight:400;color:var(--lb)}
.hsp{flex:1}
header select,header button{font:inherit}
.hbtn{background:transparent;border:1px solid var(--lb);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}
.hbtn:hover{background:var(--dk2)}
header select{background:var(--dk2);color:#fff;border:1px solid var(--lb);border-radius:6px;padding:6px 8px}
nav{background:var(--dk2);display:flex;gap:2px;padding:0 16px;overflow-x:auto}
nav button{background:none;border:0;color:#cfe3f7;font:inherit;font-weight:600;padding:11px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--cyan)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:17px;color:var(--navy)}
.card h3{margin:0 0 6px;font-size:15px;color:var(--dk2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
input,select,textarea{font:inherit;color:var(--ink)}
label.f input,label.f select,td input,td select,.tb input,.tb select{border:1px solid var(--lt2);border-radius:5px;padding:5px 7px;background:#fff;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--dk2)}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.sec:hover{background:#eaf3fc}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:3px 8px;font-size:13px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;font-weight:600;white-space:nowrap;position:sticky;top:0}
th.n,td.n{text-align:right}
td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:nth-child(even) td{background:#fafbfc}
tr.tot td{background:#e6eef7;font-weight:700;border-top:2px solid var(--blue)}
td input{width:100%}
td input.num{text-align:right;width:96px}
td input.pct{width:70px}
td input.nm{width:190px}
td input.pr{width:96px}
td input.dt{width:132px}
.ro{color:var(--ink);background:transparent!important}
.ok{background:#e3f2e4!important;color:var(--ok)}
.warn{background:#fff1d6!important;color:var(--warn)}
.bad{background:#fbe1dd!important;color:var(--bad)}
.crit{color:var(--orange);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-left:6px solid var(--grey);border-radius:10px;padding:10px 14px}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.bad{border-left-color:var(--bad)}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.15}
.kpi .s{font-size:13px;font-weight:600}
.kpi.ok .s{color:var(--ok)} .kpi.warn .s{color:var(--warn)} .kpi.bad .s{color:var(--bad)}
.kpi .s.neu{color:var(--muted);font-weight:400}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-bottom:6px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg.ch{width:100%;height:auto;display:block;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif}
svg text{fill:#3a4653;font-size:12px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .btn{margin-top:10px}
.steps{margin:0;padding-left:20px} .steps li{margin:4px 0}
.gantt-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:16px;padding:4px 12px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--blue);color:#fff}
.fx td:first-child{font-weight:700;color:var(--blue);width:70px} .fx td:nth-child(3){font-family:Consolas,monospace}
.fx td{white-space:normal}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.phead{display:none}
@media print{
  header,nav,.noprint,.tb{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .card{break-inside:avoid;border-color:#bbb}
  .phead{display:block;margin-bottom:8px}
  .phead h1{margin:0;color:var(--navy)}
}
</style>

function legend(items){return`<div class="legend">${items.map(i=>`<span><svg width="30" height="12" aria-hidden="true">${i.line?`<line x1="0" x2="30" y1="6" y2="6" stroke="${i.c}" stroke-width="${i.line===2?2.5:2.5}" ${i.dash?`stroke-dasharray="${i.dash}"`:''}/>`:''}${i.box?`<rect x="8" y="1" width="14" height="10" fill="${i.c}"/>`:''}${i.dot?`<circle cx="15" cy="6" r="4.5" fill="${i.c}"/>`:''}${i.sq?`<rect x="10" y="1.5" width="9" height="9" fill="${i.c}"/>`:''}${i.tri?`<path d="M15,0 L21,11 L9,11Z" fill="${i.c}"/>`:''}</svg>${esc(i.n)}</span>`).join('')}</div>`}

function chartS(P,S,ms,sel){
  const R=baseRange(P,S),d0=R.s-1,upTo=ms.filter(m=>m.st.date<=sel.st.date);
  const last=sel,lt=last.tot;
  const tf=timeForecast(P,S,last),finF=tf.fin||R.f;
  const x1=Math.max(R.f,finF,last.day)+Math.ceil((R.f-d0)*0.04);
  const step=Math.max(1,Math.floor((R.f-d0)/300)),pvPts=[];
  for(let d=d0;d<=R.f;d+=step)if(d===d0||S.cal===7||((d-4)%7+7)%7<5)pvPts.push([d,pvTotal(P,S,d)]);
  if(pvPts[pvPts.length-1][0]!==R.f)pvPts.push([R.f,pvTotal(P,S,R.f)]);
  const evPts=[[d0,0],...upTo.map(m=>[m.day,m.tot.ev])],acPts=[[d0,0],...upTo.map(m=>[m.day,m.tot.ac])];
  const bac=lt.bac,eac=lt.eac==null?bac:lt.eac;
  const ymax=Math.max(bac,eac,...upTo.map(m=>m.tot.ac))*1.08||1;
  const yt=niceTicks(0,ymax),f=frame({x:[d0,x1],y:[0,yt[yt.length-1]],xt:dateTicks(d0,x1),yt});
  const{X,Y}=f;let b='';
  b+=hline(bac,Y,f,t('lbl_bac')+' '+cf(bac),C.grey);
  b+=vline(last.day,X,f,t('lbl_status')+' '+fd(last.day),'#4d5b68');
  b+=pl(pvPts,X,Y,C.pv,{w:3});
  const cur=P.currency?' '+P.currency:'';
  b+=pl(evPts,X,Y,C.ev)+dots(evPts.slice(1),X,Y,C.ev,p=>`EV ${fd(p[0])}: ${fN(p[1])}${cur}`,'sq');
  b+=pl(acPts,X,Y,C.ac)+dots(acPts.slice(1),X,Y,C.ac,p=>`AC ${fd(p[0])}: ${fN(p[1])}${cur}`,'tri');
  // forecasts
  const L=[last.day,finF];
  b+=pl([[last.day,lt.ev],[finF,bac]],X,Y,C.ev,{dash:'2 5',w:2.5});
  b+=pl([[last.day,lt.ac],[finF,eac]],X,Y,C.ac,{dash:'2 5',w:2.5});
  b+=`<text x="${Math.min(X(finF),f.w-f.m.r)-2}" y="${Y(eac)+(eac>=bac?-8:16)}" text-anchor="end" style="fill:${C.ac};font-weight:700">${t('lbl_eac')} ${cf(eac)}</text>`;
  // SV / CV brackets
  const bx=X(last.day)+9;
  const br=(a,c,lab,col)=>Math.abs(Y(a)-Y(c))<3?'':`<line x1="${bx}" x2="${bx}" y1="${Y(a)}" y2="${Y(c)}" stroke="${col}" stroke-width="3"/><text x="${bx+6}" y="${(Y(a)+Y(c))/2+4}" style="fill:${col};font-weight:700">${lab}</text>`;
  b+=br(lt.pv,lt.ev,'SV '+cf(lt.sv),C.pv)+br(lt.ev,lt.ac,'CV '+cf(lt.cv),C.ac);
  return legend([{n:t('lg_pv'),c:C.pv,line:1},{n:t('lg_ev'),c:C.ev,line:1,sq:1},{n:t('lg_ac'),c:C.ac,line:1,tri:1},{n:t('lg_fc'),c:'#4d5b68',line:1,dash:'2 4'}])+f.wrap(b);
}
function chartIdx(ms){
  const pts=k=>ms.filter(m=>m.tot[k]!=null).map(m=>[m.day,m.tot[k]]);
  const spi=pts('spi'),cpi=pts('cpi'),all=[...spi,...cpi].map(p=>p[1]);
  const lo=Math.min(0.6,...all)-0.05,hi=Math.max(1.4,...all)+0.05,yt=niceTicks(lo,hi,6);
  const d0=Math.min(...ms.map(m=>m.day))-10,d1=Math.max(...ms.map(m=>m.day))+10;
  const f=frame({h:300,x:[d0,d1],y:[yt[0],yt[yt.length-1]],xt:dateTicks(d0,d1),yt,yf:v=>fN(v,1)});
  let b=hline(1,f.Y,f,'1.0','#4d5b68');
  b+=pl(spi,f.X,f.Y,C.pv)+dots(spi,f.X,f.Y,C.pv,p=>`SPI ${fd(p[0])}: ${fR(p[1])}`)+pl(cpi,f.X,f.Y,C.ac)+dots(cpi,f.X,f.Y,C.ac,p=>`CPI ${fd(p[0])}: ${fR(p[1])}`,'tri');
  return legend([{n:'SPI',c:C.pv,line:1,dot:1},{n:'CPI',c:C.ac,line:1,tri:1}])+f.wrap(b);
}
function barChart({cats,series,h=320,ttl}){
  const all=series.flatMap(s=>s.vals),yt=niceTicks(Math.min(0,...all),Math.max(0,...all)||1);
  const f=frame({h,x:[0,cats.length],y:[yt[0],yt[yt.length-1]],yt});
  const{X,Y}=f,band=X(1)-X(0),gw=band*.74,bw=gw/series.length;let b='';
  cats.forEach((c,i)=>{
    const gx=X(i)+(band-gw)/2;
    series.forEach((s,j)=>{const v=s.vals[i],y0=Y(0),y1=Y(v),x0=gx+j*bw;
      b+=`<rect x="${x0.toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(1,Math.abs(y1-y0)).toFixed(1)}" fill="${s.c}"><title>${esc(s.n)} — ${esc(c)}: ${fN(v)}</title></rect>`;
      if(cats.length*series.length<=18)b+=`<text x="${(x0+bw/2-1).toFixed(1)}" y="${(v>=0?y1-4:y1+12).toFixed(1)}" text-anchor="middle" style="font-size:11px">${cf(v)}</text>`});
    b+=`<text x="${X(i)+band/2}" y="${f.h-f.m.b+18}" text-anchor="middle">${esc(c.length>14?c.slice(0,13)+'…':c)}</text>`;
  });
  return legend(series.map(s=>({n:s.n,c:s.c,box:1})))+f.wrap(b);
}

/* ---- Gantt */
function gantt(P,S,sel){
  const T=P.tasks;if(!T.length)return'';
  const R=baseRange(P,S);
  let d0=Math.min(S.start,R.s),d1=Math.max(S.end,R.f);
  if(sel)d1=Math.max(d1,sel.day);d0-=2;d1+=3;
  const LW=190,RH=30,HH=34,W=1000,pw=W-LW-10,X=d=>LW+(d-d0)/(d1-d0+1)*pw,Hh=HH+T.length*RH+8;
  const idx=new Map(T.map((x,i)=>[x.uid,i]));
  let s=`<svg class="ch" viewBox="0 0 ${W} ${Hh}" style="min-width:760px"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#4d5b68"/></marker></defs>`;
  dateTicks(d0,d1).forEach(([d,l])=>{s+=`<line x1="${X(d)}" x2="${X(d)}" y1="${HH-6}" y2="${Hh}" stroke="#e3e7ec"/><text x="${X(d)+3}" y="${HH-12}" style="font-size:11px">${esc(l)}</text>`});
  T.forEach((x,i)=>{const y=HH+i*RH;if(i%2)s+=`<rect x="0" y="${y}" width="${W}" height="${RH}" fill="#f7f9fb"/>`;
    s+=`<text x="6" y="${y+RH/2+4}" style="font-size:13px">${i+1}. ${esc((x.name||'—').slice(0,24))}</text>`});
  if(sel)s+=`<line x1="${X(sel.day+1)}" x2="${X(sel.day+1)}" y1="${HH-6}" y2="${Hh}" stroke="${C.bad}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  T.forEach((x,i)=>{
    const r=S.res.get(x.uid),y=HH+i*RH,b=basePlan(P,S,x);
    if(P.baseline)s+=`<rect x="${X(b.s)}" y="${y+RH-9}" width="${Math.max(3,X(b.f+1)-X(b.s))}" height="5" fill="${C.grey}"><title>${esc(t('g_base'))}: ${fd(b.s)} → ${fd(b.f)}</title></rect>`;
    const w=Math.max(3,X(r.f+1)-X(r.s)),col=r.critical?C.ac:C.pv,pct=sel?clamp(num(sel.st.pct[x.uid]),0,100):0;
    s+=`<rect x="${X(r.s)}" y="${y+5}" width="${w}" height="14" rx="3" fill="${col}"><title>${esc(x.name)}: ${fd(r.s)} → ${fd(r.f)}${r.critical?' ('+t('crit')+')':''}</title></rect>`;
    if(pct>0)s+=`<rect x="${X(r.s)}" y="${y+9}" width="${w*pct/100}" height="6" fill="${C.navy}"/>`;
  });
  T.forEach((x,i)=>(x.preds||[]).forEach(p=>{if(!idx.has(p.uid)||p.uid===x.uid)return;
    const a=S.res.get(p.uid),c=S.res.get(x.uid),ya=HH+idx.get(p.uid)*RH+12,yc=HH+i*RH+12;
    const xa=(p.type==='SS'||p.type==='SF')?X(a.s):X(a.f+1),xc=(p.type==='FF'||p.type==='SF')?X(c.f+1):X(c.s);
    const dir=(p.type==='FF'||p.type==='SF')?6:-6;
    s+=`<path d="M${xa},${ya} h${(p.type==='SS'||p.type==='SF')?-6:6} V${yc} H${xc+(dir<0?-1:1)*0}" fill="none" stroke="#4d5b68" stroke-width="1" marker-end="url(#ar)"/>`}));
  s+='</svg>';
  return legend([{n:t('g_plan'),c:C.pv,box:1},{n:t('g_crit'),c:C.ac,box:1},{n:t('g_base'),c:C.grey,box:1},{n:t('g_prog'),c:C.navy,box:1},{n:t('lg_st'),c:C.bad,line:1,dash:'5 4'}])+`<div class="gantt-wrap">${s}</div>`;
}

function parsePreds(str,self){
  const out=[];String(str).split(/[,;\s]+/).forEach(tok=>{const m=/^(\d+)(FS|SS|FF|SF)?([+-]\d+)?$/i.exec(tok.trim());if(!m)return;
    const tk=P.tasks[+m[1]-1];if(tk&&tk.uid!==self&&!out.some(o=>o.uid===tk.uid))out.push({uid:tk.uid,type:(m[2]||'FS').toUpperCase(),lag:m[3]?+m[3]:0})});return out}

const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  files.forEach(([name,text])=>{const nb=enc.encode(name),db=enc.encode(text),crc=crc32(db);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length});
  const cdLen=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const xesc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
function sheetXml(rows,widths){
  const cols=`<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`;
  const data=rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{if(v==null||v==='')return'';const ref=colL(ci)+(ri+1);
    return typeof v==='number'&&isFinite(v)?`<c r="${ref}" s="${r._h?1:2}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr" s="${r._h?1:0}"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`}).join('')}</row>`).join('');
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${data}</sheetData></worksheet>`;
}
